server {
  listen 80;
  root /usr/share/nginx/html;
  index service-selection.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # 1. 站点请求直接转发到Ollama根路径（无URI）
  location /site1/ {
    proxy_pass http://ollama-model:11434/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location /site2-a/ {
    proxy_pass http://ollama-model:11434/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location /site2-b/ {
    proxy_pass http://ollama-model:11434/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  # 2. Ping接口修复：用rewrite替代直接URI（兼容Nginx语法）
  location ~ /(site1|site2-a|site2-b)/ping$ {
    # 先重写URL到/api/tags，再转发到Ollama根路径
    rewrite ^/(site1|site2-a|site2-b)/ping$ /api/tags break;
    proxy_pass http://ollama-model:11434;  # 注意：这里无末尾的/（不带URI）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
  }
}