server {
  listen 80;
  root /usr/share/nginx/html;
  index service-selection.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # 直接转发到各网关的端口（简化路径，避免拼接错误）
  location /site1/ {
    proxy_pass http://site1-gw:80/;  # 直接转发到site1-gw的根路径
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10s;
  }

  location /site2-a/ {
    proxy_pass http://site2-a-gw:80/;  # 直接转发到site2-a-gw的根路径
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10s;
  }

  location /site2-b/ {
    proxy_pass http://site2-b-gw:80/;  # 直接转发到site2-b-gw的根路径
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10s;
  }
}