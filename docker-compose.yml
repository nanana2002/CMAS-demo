services:
  center:
    build: ./center
    container_name: center
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - STORE_PATH=/data/store.json
    volumes:
      - center_data:/data
    networks:
      - cmas-network

  platform:
    build: ./platform
    container_name: platform
    ports:
      - "8081:80"
    environment:
      # 浏览器访问 platform 页面时，会用这个默认值请求 center
      - CENTER_BASE_URL=http://localhost:8080
    networks:
      - cmas-network

  client:
    build: ./client
    container_name: client
    ports:
      - "8082:80"
    environment:
      - CENTER_BASE_URL=http://localhost:8080
    depends_on:
      - site2-a-gw
      - site2-b-gw
      - site1-gw
    networks:
      - cmas-network
    restart: always

  #site2-a:
  #  build: ./site
  #  container_name: site2-a
  #  environment:
  #    - PORT=9000
  #    - INSTANCE_ID=site2-a
  #  ports:
  #    - "9001:9000"

  #site2-b:
  #  build: ./site
  #  container_name: site2-b
  #  environment:
  #    - PORT=9000
  #    - INSTANCE_ID=site2-b
  #  ports:
  #    - "9002:9000"

  #site1:
  #  build: ./site
  #  container_name: site1
  #  environment:
  #    - PORT=9000
  #    - INSTANCE_ID=site1
  #  ports:
  #    - "9003:9000"

  # Ollama 模型服务（核心）
  ollama-model:
    image: ollama/ollama:latest
    container_name: ollama-model
    ports:
      - "11434:11434"
    volumes:
      - /data/ollama-model:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODEL=qwen3-vl:2b
      # 新增：允许所有跨域请求（解决403核心）
      - OLLAMA_ORIGINS=*
      - OLLAMA_ALLOW_CORS=1
    restart: always
    networks:
      - cmas-network

  site1-gw:
    build: ./site-gateway
    container_name: site1-gw
    ports:
      - "9003:80"
    environment:
      - OLLAMA_UPSTREAM=http://ollama-model:11434
    depends_on:
      - ollama-model
    networks:
      - cmas-network
    restart: always

  site2-a-gw:
    build: ./site-gateway
    container_name: site2-a-gw
    ports:
      - "9001:80"
    environment:
      - OLLAMA_UPSTREAM=http://ollama-model:11434
    depends_on:
      - ollama-model
    networks:
      - cmas-network
    restart: always

  site2-b-gw:
    build: ./site-gateway
    container_name: site2-b-gw
    ports:
      - "9002:80"
    environment:
      - OLLAMA_UPSTREAM=http://ollama-model:11434
    depends_on:
      - ollama-model
    networks:
      - cmas-network
    restart: always

volumes:
  center_data: {}

# 统一网络，确保所有容器互通
networks:
  cmas-network:
    driver: bridge